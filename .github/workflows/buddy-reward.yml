name: Buddy daily reward

# 每天定时跑一次：一次把「签到」和「派猫猫」都做掉，结果推飞书。
#
# cron 为什么是 16:50 UTC，而不是「07:50 减去 8 小时」：
#
#   1. schedule 只在仓库的**默认分支**上生效，且工作流文件必须已存在于默认分支。
#   2. 默认按 UTC 计算，不识别夏令时。中国全年 UTC+8，所以恒定不变：
#        16:50 UTC = 次日北京时间 00:50
#      注意 UTC 的日期比北京早一天，翻日志时别以为跑错了天。
#   3. **GitHub 的 cron 会晚好几个小时，所以这里故意提前排。**
#      自 2026-08 起调度器大面积积压（官方社区 #206019 / #208924），
#      created_at == run_started_at —— 是调度事件本身晚创建，不是排队等 runner。
#      本仓库实测：名义 00:07 UTC 的那阵子，实际稳定落在 05:08~05:41 UTC，恒定晚约 5 小时。
#
#      于是换个思路：不去和延迟对抗，而是**把名义时间提前，让延迟把它推到早上**。
#      名义 16:50 UTC（北京 00:50）+ 5 小时延迟 ≈ 北京 05:50，赶在 07:50 之前完成。
#
#   4. **提前量有硬上限：最早只能排到北京 00:00 之后。**
#      再往前（例如 15:50 UTC = 北京 23:50）就落进了**前一个北京日**，
#      延迟只要一波动就会出现「某天重复、另一天整天空档」。实测模拟 200 天：
#        名义 16:50 UTC（北京 00:50）→ 漏 0 天、重 0 天；延迟 ≤7h 时 200/200 都早于 07:50
#        名义 15:50 UTC（北京 23:50）→ 漏 100 天、重 99 天 ❌
#      因为延迟永远 ≥ 0，把名义时刻放在北京日的最开头（00:50），
#      落点就只会落在当天 00:50~00:50+延迟 这段区间里，一天不多一天不少。
#
#   5. 所以能力边界是：**延迟 ≤ 7 小时时保证在 07:50 前跑完**（当前实测 5~5.5 小时，
#      还有约 1.5 小时余量）。超过 7 小时就会晚于 07:50，但仍然当天跑、不会漏。
#      若哪天需要「无论延迟多大都必须准点」，只能绕开 cron 调度器，
#      用外部定时器打 workflow_dispatch（做法见 README「准点触发」）。
on:
  schedule:
    - cron: "50 16 * * *"
  # 手动触发：首次验证、偶尔补跑；也是外部定时器准点触发的入口。
  # 脚本幂等，重复跑无副作用。
  workflow_dispatch:

# 同一时间只跑一个，避免两次运行撞车重复派遣
concurrency:
  group: buddy-daily-reward
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 记录「被哪条 cron 触发」和「实际几点开始」。
      # GitHub 的 cron 调度器可能把运行推迟好几个小时才创建（见文件头第 3 条），
      # 有这两行就能一眼算出晚了多久，不用再去猜。
      - name: Log trigger and start time
        run: |
          set -euo pipefail
          echo "schedule   : ${{ github.event.schedule }}"
          echo "event      : ${{ github.event_name }}"
          echo "started UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "started CST: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

      # 解释器路径不写死版本号：用 command -v 动态取，并交给后续步骤使用
      - name: Resolve interpreter
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python3 || command -v python)"
          if [ -z "${PYTHON_BIN}" ]; then
            echo "找不到 python 解释器" >&2
            exit 1
          fi
          echo "PYTHON_BIN=${PYTHON_BIN}" >> "$GITHUB_ENV"
          "${PYTHON_BIN}" --version

      # 预检：确认 Secret 真的送到了，而且长度合理。
      #
      # 为什么需要这一步：Secret 是只写的，网页上粘贴 6700+ 字符极容易
      # 被悄悄截断，而且粘错了当场看不出来。截断后的值仍是非空的，
      # 接口只会回一个 401，看上去和「会话过期」一模一样，会把人带偏。
      #
      # 这里只打印长度和 sha256 指纹（与刷新脚本输出的「指纹」同算法），
      # 泄露不了内容，但能一眼判断 Secret 是否完整。
      - name: Preflight - check WB_COOKIE shape
        env:
          WB_COOKIE: ${{ secrets.WB_COOKIE }}
        run: |
          set -euo pipefail
          if [ -z "${WB_COOKIE}" ]; then
            echo "::error::Secret WB_COOKIE 是空的（没配置，或名字拼错）"
            exit 1
          fi
          LEN=${#WB_COOKIE}
          FP=$(printf '%s' "$WB_COOKIE" | sha256sum | cut -c1-8)
          echo "WB_COOKIE: 长度=${LEN} 指纹=${FP}"
          if [ "$LEN" -lt 1000 ]; then
            echo "::error::WB_COOKIE 只有 ${LEN} 个字符，明显被截断了。"
            echo "::error::完整的会话 Cookie 有数千字符，请在本机重跑一次刷新/部署脚本重新注入。"
            exit 1
          fi
          case "$WB_COOKIE" in
            *KEYCLOAK_SESSION*) ;;
            *)
              echo "::error::WB_COOKIE 里看不到 KEYCLOAK_SESSION，内容可能被篡改或粘贴错位。"
              exit 1
              ;;
          esac

      # 凭证只从 Secret 注入到环境变量，不落盘、不进命令行、不进日志
      - name: Run checkin + buddy travel
        env:
          WB_COOKIE: ${{ secrets.WB_COOKIE }}
        run: |
          set -euo pipefail
          mkdir -p out
          # 签到成功 → 退出码 0；签到失败 → 退出码 1，但旅行结果仍会写进 result.json
          set +e
          "$PYTHON_BIN" scripts/cloud_runner.py \
            --out out/result.json \
            --raw-out out/raw_masked.json
          echo "RUNNER_EXIT=$?" >> "$GITHUB_ENV"
          set -e

      - name: Push to Feishu
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
        run: |
          set -euo pipefail
          # cron 这一次只当兜底：如果外部定时器已经在准点跑过了，这里会是一次
          # 「纯确认」（签到幂等跳过 + 旅行今日已派完），再发一张卡就是重复噪音。
          # 所以只在 schedule 触发时加 --quiet-noop；workflow_dispatch（外部定时器、
          # 手动补跑）照常推送。**失败永不静默**，判据见 feishu_notify.is_noop。
          QUIET=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            QUIET="--quiet-noop"
          fi
          if [ -f out/result.json ]; then
            "$PYTHON_BIN" scripts/feishu_notify.py out/result.json $QUIET || true
          else
            echo "没有产出 result.json，跳过推送"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buddy-reward-result
          path: out/
          if-no-files-found: ignore
          retention-days: 14

      # 签到失败时让这次运行标红，方便一眼看到；旅行失败不影响
      - name: Enforce checkin result
        if: env.RUNNER_EXIT != '0'
        run: |
          echo "签到未成功（exit=${RUNNER_EXIT}），请查看上方日志与飞书通知" >&2
          exit 1
